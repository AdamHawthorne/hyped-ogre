name: Deploy Hyped Ogre

# Full Linux, Windows and Docker safety tests run on the pull request via
# safety.yml before merge. Do not run the entire suite a second time here.
# Keep this workflow limited to the release snapshot, Fly deploy and verification.
# Require green PR checks before merging; protect main with required status checks.
# Keep the filename for existing deployment links.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyped-ogre-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
        with:
          version: '0.5.1'
      - name: Verify existing volume and record backup and rollback image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: python scripts/fly_release.py prepare "$RUNNER_TEMP/hyped-release.json"
      - name: Deploy merged commit to the existing app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy -a hyped-diceman --remote-only --ha=false
      - name: Verify the existing volume and running Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: python scripts/fly_release.py verify "$RUNNER_TEMP/hyped-release.json"
