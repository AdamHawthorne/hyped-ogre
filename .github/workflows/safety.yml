name: Hyped Ogre safety checks
on:
  push:
    branches: [main, 'refactor/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile all Python modules
        run: python -m compileall -q rollf.py cogs hyped_ogre tests
      - name: Install runtime dependencies for interaction tests
        run: pip install -r requirements.txt
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Run migration regression guards
        run: python -m unittest discover -s tests -v
      - name: Verify Docker build includes modules
        run: docker build -t hyped-ogre-test .
      - name: Construct countdown V2 views in real runtime image
        run: |
          docker run --rm --entrypoint python hyped-ogre-test -c '
          from cogs.countdown import CountdownLayout
          sample = {"title": "Hyped Test", "target_ts": 1793833200,
                    "image_url": "", "remind_minutes": 30,
                    "repeat_seconds": 0, "active": 1}
          for icon in ("", "https://i.vgy.me/example.png"):
              sample["image_url"] = icon
              view = CountdownLayout(sample, now=1793800000, preview=True)
              assert 0 < view.total_children_count < 40
          print("V2 countdown views built successfully")
          '
      - name: Construct suggestions V2 views in real runtime image
        run: |
          docker run --rm --entrypoint python hyped-ogre-test -c '
          from cogs.suggestions import SuggestionsPanel, SuggestionPost
          class DummyCog: pass
          panel = SuggestionsPanel(DummyCog())
          named = SuggestionPost("Test feedback", anonymous=False, user_id=123)
          anon = SuggestionPost("Anonymous feedback", anonymous=True)
          assert 0 < panel.total_children_count < 20
          assert 0 < named.total_children_count < 20
          assert 0 < anon.total_children_count < 20
          print("V2 suggestions views built successfully")
          '
      - name: Verify persistent Forever V2 panel in real runtime image
        run: |
          docker run --rm --entrypoint python hyped-ogre-test -c '
          from cogs.forever_role import ForeverRoleV2Panel, LeadershipApplicationPost
          panel = ForeverRoleV2Panel(1, 2, lambda message: None)
          preview = ForeverRoleV2Panel(1, 2, lambda message: None, preview=True)
          assert panel.is_persistent()
          assert not preview.is_persistent()
          assert preview.timeout == 300
          post = LeadershipApplicationPost(
              applicant_id=123,
              interest="Leading",
              experience="Test experience",
              extra="Test extra",
          )
          assert 0 < panel.total_children_count < 30
          assert 0 < post.total_children_count < 20
          print("V2 Forever production and preview panels built successfully")
          '


      - name: Verify persistent raid roster V2 controls in runtime image
        run: |
          docker run --rm --entrypoint python hyped-ogre-test -c '
          import discord
          from cogs.raid_schedule import RaidEventPanel
          event = {"raid_id": 7, "raid_at": "2026-12-09T21:00:00+00:00",
                   "instance_1": "Hyjal (20m)", "instance_2": "Barrows (10m)",
                   "instance_3": None, "signup_open": 1,
                   "wowsims_policy": "optional", "roster_published": 0,
                   "archived_at": None}
          async def callback(interaction): pass
          view = RaidEventPanel(event, on_signup=callback, on_update=callback,
                                on_gear=callback, on_absent=callback,
                                on_remind=callback)
          ids = {x.custom_id for x in view.walk_children()
                 if isinstance(x, discord.ui.Button)}
          assert view.is_persistent()
          assert ids == {f"hyped_raid_7_{key}" for key in
                         ("signup", "reminder", "update", "gear", "absent")}
          print("Persistent raid panel and button IDs built successfully")
          '
