name: Hyped Ogre safety checks
on:
  push:
    branches: [main, 'refactor/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile all Python modules
        run: python -m compileall -q rollf.py cogs hyped_ogre tests
      - name: Install runtime dependencies for interaction tests
        run: pip install -r requirements.txt
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Run migration regression guards
        run: python -m unittest discover -s tests -v
      - name: Verify Docker build includes modules
        run: docker build -t hyped-ogre-test .
      - name: Construct countdown V2 views in real runtime image
        run: |
          docker run --rm --entrypoint python hyped-ogre-test -c '
          from cogs.countdown import CountdownLayout
          sample = {"title": "Hyped Test", "target_ts": 1793833200,
                    "image_url": "", "remind_minutes": 30,
                    "repeat_seconds": 0, "active": 1}
          for icon in ("", "https://i.vgy.me/example.png"):
              sample["image_url"] = icon
              view = CountdownLayout(sample, now=1793800000, preview=True)
              assert 0 < view.total_children_count < 40
          print("V2 countdown views built successfully")
          '
      - name: Construct suggestions V2 views in real runtime image
        run: |
          docker run --rm --entrypoint python hyped-ogre-test -c '
          from cogs.suggestions import SuggestionsPanel, SuggestionPost
          class DummyCog: pass
          panel = SuggestionsPanel(DummyCog())
          named = SuggestionPost("Test feedback", anonymous=False, user_id=123)
          anon = SuggestionPost("Anonymous feedback", anonymous=True)
          assert 0 < panel.total_children_count < 20
          assert 0 < named.total_children_count < 20
          assert 0 < anon.total_children_count < 20
          print("V2 suggestions views built successfully")
          '
      - name: Verify persistent Forever V2 panel in real runtime image
        run: |
          docker run --rm --entrypoint python hyped-ogre-test -c '
          from cogs.forever_role import ForeverRoleV2Panel, LeadershipApplicationPost
          panel = ForeverRoleV2Panel(1, 2, lambda message: None)
          preview = ForeverRoleV2Panel(1, 2, lambda message: None, preview=True)
          assert panel.is_persistent()
          assert not preview.is_persistent()
          assert preview.timeout == 300
          post = LeadershipApplicationPost(
              applicant_id=123,
              interest="Leading",
              experience="Test experience",
              extra="Test extra",
          )
          assert 0 < panel.total_children_count < 30
          assert 0 < post.total_children_count < 20
          print("V2 Forever production and preview panels built successfully")
          '


      - name: Verify persistent raid roster V2 controls in runtime image
        run: |
          docker run --rm --entrypoint python hyped-ogre-test -c '
          import discord
          from cogs.raid_schedule import RaidEventPanel
          event = {"raid_id": 7, "raid_at": "2026-12-09T21:00:00+00:00",
                   "instance_1": "Hyjal (20m)", "instance_2": "Barrows (10m)",
                   "instance_3": None, "signup_open": 1,
                   "wowsims_policy": "optional", "roster_published": 0,
                   "archived_at": None}
          async def callback(interaction): pass
          view = RaidEventPanel(event, on_signup=callback, on_update=callback,
                                on_gear=callback, on_absent=callback,
                                on_remind=callback)
          ids = {x.custom_id for x in view.walk_children()
                 if isinstance(x, discord.ui.Button)}
          assert view.is_persistent()
          assert ids == {f"hyped_raid_7_{key}" for key in
                         ("signup", "reminder", "update", "gear", "absent")}
          print("Persistent raid panel and button IDs built successfully")
          '

      - name: Construct private raid poster schedule and advanced V2 views in runtime image
        run: |
          docker run --rm --entrypoint python hyped-ogre-test -c '
          import tempfile
          from pathlib import Path
          from types import SimpleNamespace
          from cogs import raid_signup, raid_schedule
          from cogs.raid_poster import RaidPosterView
          with tempfile.TemporaryDirectory() as tmp:
              path = str(Path(tmp) / "raid_signup.db")
              raid_signup.create_schema(path)
              raid_schedule.ensure_raid_fields(path)
              cog = SimpleNamespace(raid_db_path=lambda: path,
                                    allowed=lambda interaction: True)
              schedule = RaidPosterView(cog, 42)
              advanced = RaidPosterView(cog, 42, schedule.draft, page="advanced")
              assert schedule.timeout == 900
              assert 0 < schedule.total_children_count <= 40
              assert 0 < advanced.total_children_count <= 40
              assert "Advanced settings" in str(schedule.to_components())
              assert "Back to schedule" in str(advanced.to_components())
          print("Private raid poster schedule and advanced views built successfully")
          '

      - name: Verify legacy raid Sheets bridge is canonical in runtime image
        run: |
          docker run --rm --entrypoint python hyped-ogre-test -c '
          from cogs import raid_sheets, raid_sheets_v3, raid_signup
          from hyped_ogre.integrations import sheets
          assert raid_sheets is sheets
          assert raid_sheets_v3.raid_sheets is sheets
          assert raid_signup.raid_sheets is sheets
          assert sheets.SHEETS["roster"][0] == "RM - Roster Builder"
          assert sheets._existing_keys("roster", [[], ["1", "", "42"]]) == {"1:42": 2}
          print("Google Sheets bridge imports and legacy roster keys validated")
          '

      - name: Verify per-raid Sheets dashboard import and cells in runtime image
        run: |
          docker run --rm --entrypoint python hyped-ogre-test -c '
          from cogs import raid_sheets_v3, raid_signup, raid_sheets
          from hyped_ogre.features.raids import sheets_dashboard
          assert raid_sheets_v3 is sheets_dashboard
          assert raid_signup.raid_sheets_v3 is sheets_dashboard
          assert sheets_dashboard.raid_sheets is raid_sheets
          event = {"raid_id": 7, "raid_at": "2026-12-09T21:00:00+00:00",
                   "instance_1": "Hyjal (20m)", "instance_2": "Barrows (10m)",
                   "instance_3": None, "archive_notes": "Manual notes",
                   "wcl_url": "https://www.warcraftlogs.com/reports/test"}
          rows = sheets_dashboard._header(event, [], sheets_dashboard.tab_title(event))
          assert rows[1][6] == "Barrows 🔸 (9)"
          assert rows[3][1] == event["wcl_url"]
          assert rows[3][3] == "Manual notes"
          assert len(rows[6]) == 20
          print("Per-raid Sheets dashboard import and fixed cells validated")
          '

      - name: Verify live raid signup extension identity and SQLite schema
        run: |
          docker run --rm --entrypoint python hyped-ogre-test -c '
          import tempfile
          from pathlib import Path
          from discord.ext import commands
          from cogs import raid_signup as raid
          from hyped_ogre.features.raids import signup_reference
          assert raid.RaidPrototype.__module__ == "cogs.raid_signup"
          assert raid.setup.__module__ == "cogs.raid_signup"
          assert issubclass(raid.RaidPrototype, commands.GroupCog)
          assert raid.CLASS_SPECS is signup_reference.CLASS_SPECS
          with tempfile.TemporaryDirectory() as tmp:
              db_path = str(Path(tmp) / "raid_signup.db")
              raid.create_schema(db_path)
              with raid.database(db_path) as db:
                  assert db.execute(
                      "SELECT COUNT(*) FROM characters"
                  ).fetchone()[0] == 0
          print("Original raid extension and schema wrapper validated")
          '

      - name: Verify read-only raid queries and shared LFG imports in runtime image
        run: |
          docker run --rm -e HYPED_GUILD_ID=77 --entrypoint python hyped-ogre-test -c '
          import tempfile
          from pathlib import Path
          from cogs import raid_signup, lfg_preview
          from hyped_ogre.features.characters import queries
          from hyped_ogre.features.raids import signup_queries
          assert lfg_preview.raid_signup is raid_signup
          assert raid_signup.RaidPrototype.__module__ == "cogs.raid_signup"
          with tempfile.TemporaryDirectory() as tmp:
              path = str(Path(tmp) / "raid_signup.db")
              raid_signup.create_schema(path)
              assert raid_signup.member_characters(42, path) == []
              assert raid_signup.my_signup(1, 42, path) is None
              with raid_signup.database(path) as con:
                  assert queries.member_characters(con, 42) == []
                  assert signup_queries.my_signup(con, 1, 42) is None
          print("Read-only raid queries and LFG import path validated")
          '

      - name: Verify character write helpers and original Discord module in runtime image
        run: |
          docker run --rm -e HYPED_GUILD_ID=77 --entrypoint python hyped-ogre-test -c '
          import tempfile
          from pathlib import Path
          from cogs import raid_signup as raid, lfg_preview
          from hyped_ogre.features.characters import mutations
          assert lfg_preview.raid_signup is raid
          assert raid.RaidPrototype.__module__ == "cogs.raid_signup"
          with tempfile.TemporaryDirectory() as tmp:
              path = str(Path(tmp) / "raid_signup.db")
              raid.create_schema(path)
              assert raid.save_character(
                  42, "Snore Mon", "Warrior", "Protection", "Tank", path
              ) == "created"
              ident = raid.member_characters(42, path)[0][0]
              raid.set_character_race(42, ident, "Orc", path)
              assert raid.character_race(42, ident, path) == "Orc"
              assert raid.update_character_profile(
                  42, ident, "Warrior", "Fury", "DPS", path
              ) == "Snore Mon"
          print("Original Discord cog and character write helpers validated")
          '

      - name: Verify signup and absence writes using original Discord extension
        run: |
          docker run --rm --entrypoint python hyped-ogre-test -c '
          import tempfile
          from pathlib import Path
          from cogs import raid_signup as raid, raid_schedule as schedule
          from hyped_ogre.features.raids import signup_mutations
          assert raid.RaidPrototype.__module__ == "cogs.raid_signup"
          with tempfile.TemporaryDirectory() as tmp:
              path = str(Path(tmp) / "raid_signup.db")
              raid.create_schema(path)
              schedule.ensure_raid_fields(path)
              schedule.save_raid(
                  path, 3, "2026-12-09 21:00", "Hyjal (20m)",
                  wowsims_policy="optional"
              )
              raid.save_character(42, "Snore Mon", "Warrior", "Protection", "Tank", path)
              cid = raid.member_characters(42, path)[0][0]
              raid.save_signup(3, 42, cid, path, note="Coming")
              assert raid.my_signup(3, 42, path) == ("Snore Mon", "Available")
              raid.save_absence(3, 42, "Away", path)
              assert raid.my_signup(3, 42, path) == ("Snore Mon", "Unavailable")
              raid.save_signup(3, 42, cid, path)
              assert raid.my_absence(3, 42, path) is None
          print("Original signup and absence transaction path validated")
          '

      - name: Construct canonical roll and gamble panels in runtime image
        run: |
          docker run --rm --entrypoint python hyped-ogre-test -c '
          import discord
          from datetime import date
          from cogs import roll_coins, roll_gamble, roll_panels, roll_reactions
          from hyped_ogre.features.rolls import coins, gamble, panels, reactions
          assert (roll_coins, roll_gamble, roll_panels, roll_reactions) == (
              coins, gamble, panels, reactions)
          assert coins.daily_coin_prize(date(2026, 11, 1)) == 2
          async def action(interaction): pass
          view = panels.DailyRollPanel(
              day="2026-11-01", winner_text="Test", tagline="Roll",
              on_roll=action, on_leaderboard=action, on_stats=action,
              on_gamble=action)
          assert view.is_persistent()
          ids = {x.custom_id for x in view.walk_children()
                 if isinstance(x, discord.ui.Button)}
          assert "hyped_ogre_coin_gamble_v1" in ids
          assert "hyped_ogre_daily_roll_v2" in ids
          print("Roll, coin, gamble and persistent V2 controls validated")
          '
